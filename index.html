<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Dotch — Nigeria's Business Search Engine</title>
    <meta name="description" content="DOTCH — Discover verified Nigerian businesses, hotels, restaurants, shops and services. Connect directly on WhatsApp with zero middlemen fees." />
    <meta property="og:title" content="DOTCH — Discover Nigerian Businesses" />
    <meta property="og:description" content="Find verified hotels, restaurants, shops, and services across Nigeria. Connect directly on WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.dotch.site" />
    <meta property="og:image" content="https://www.dotch.site/icon-logo.png" />
    <meta name="keywords" content="dotch, Nigerian businesses, business directory Nigeria, find businesses Nigeria, hotels Nigeria, restaurants Nigeria, WhatsApp business" />
    <meta name="author" content="Dotch" />
    <meta name="google-site-verification" content="J_2kHdPGy1eRc-wPOkxlBWN9Yb3SSaJ78zlwnLTfKU8" />
    <link rel="canonical" href="https://www.dotch.site" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Dotch",
      "url": "https://www.dotch.site",
      "description": "Nigeria's Business Search Engine — Discover verified Nigerian businesses, hotels, restaurants, shops and services. Connect directly on WhatsApp.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.dotch.site/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Dotch",
        "url": "https://www.dotch.site",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.dotch.site/icon-logo.png"
        }
      }
    }
    </script>
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DOTCH — Discover Nigerian Businesses" />
    <meta name="twitter:description" content="Find verified hotels, restaurants, shops, and services across Nigeria. Connect directly on WhatsApp." />
    <meta name="twitter:image" content="https://www.dotch.site/icon-logo.png" />
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
          var t = localStorage.getItem('dotch_theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
